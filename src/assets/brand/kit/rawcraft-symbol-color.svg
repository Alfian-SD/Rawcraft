<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="rc-sym-color">
  <title id="rc-sym-color">RawCraft Symbol — Color</title>
  <defs>
    <linearGradient id="stemGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#9D84FF"/>
      <stop offset="100%" stopColor="#6C52E0"/>
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#B3A1FF"/>
      <stop offset="100%" stopColor="#7D66E3"/>
    </linearGradient>
    <linearGradient id="kickGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#8C72FF"/>
      <stop offset="100%" stopColor="#5B41D5"/>
    </linearGradient>
  </defs>

  <!-- Left Pillar / Stem of R -->
  <polygon fill="url(#stemGrad)" points="42,78 96,47 96,209 42,178"/>

  <!-- Top-Right Bowl of R with Negative Counter Hole -->
  <path fill="url(#bowlGrad)" fill-rule="evenodd" d="
    M 112 37
    L 128 28
    L 214 78
    L 214 120
    L 112 120
    Z
    M 136 64
    L 172 64
    L 186 78
    L 186 86
    L 172 100
    L 136 100
    Z
  "/>

  <!-- Bottom-Right Kinetic Kick Leg -->
  <polygon fill="url(#kickGrad)" points="136,136 214,136 214,178 128,228 128,172 164,136"/>
</svg>
