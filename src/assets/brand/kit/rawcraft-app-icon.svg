<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="rc-app-icon">
  <title id="rc-app-icon">RawCraft Desktop App Icon</title>
  <defs>
    <!-- Background Void Radial Glow -->
    <radialGradient id="iconBgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stopColor="#221C38"/>
      <stop offset="60%" stopColor="#12101D"/>
      <stop offset="100%" stopColor="#09080E"/>
    </radialGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="iconBorderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="rgba(255, 255, 255, 0.25)"/>
      <stop offset="50%" stopColor="#8C72FF"/>
      <stop offset="100%" stopColor="rgba(125, 102, 227, 0.2)"/>
    </linearGradient>

    <!-- Symbol Facet Gradients -->
    <linearGradient id="appStemGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#A794FF"/>
      <stop offset="100%" stopColor="#6C52E0"/>
    </linearGradient>
    <linearGradient id="appBowlGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#C4B5FF"/>
      <stop offset="100%" stopColor="#7D66E3"/>
    </linearGradient>
    <linearGradient id="appKickGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#9D84FF"/>
      <stop offset="100%" stopColor="#5B41D5"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#iconBgGlow)" stroke="url(#iconBorderGrad)" stroke-width="3"/>

  <!-- Centered Hex-Voxel R Symbol (Scaled 1.25) -->
  <g transform="translate(96, 96) scale(1.25)">
    <!-- Left Pillar / Stem -->
    <polygon fill="url(#appStemGrad)" points="42,78 96,47 96,209 42,178"/>

    <!-- Top-Right Bowl with Counter Hole -->
    <path fill="url(#appBowlGrad)" fill-rule="evenodd" d="
      M 112 37 L 128 28 L 214 78 L 214 120 L 112 120 Z
      M 136 64 L 172 64 L 186 78 L 186 86 L 172 100 L 136 100 Z
    "/>

    <!-- Bottom-Right Kick Leg -->
    <polygon fill="url(#appKickGrad)" points="136,136 214,136 214,178 128,228 128,172 164,136"/>
  </g>
</svg>
